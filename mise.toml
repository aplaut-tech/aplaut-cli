#:schema https://mise.jdx.dev/schema/mise.json

[tools]
cargo-dist = "0.33.0"

[tools.rust]
version = "1.98.1"
components = "rustfmt,clippy,rust-src"
targets = "x86_64-unknown-linux-musl"

[env]
RUST_BACKTRACE = "1"
# ring и aws-lc-sys (через rustls) компилируют C-код; для musl-таргета нужны заголовки musl,
# с заголовками glibc aws-lc не линкуется (__isoc23_strtol). Локально — пакет musl (musl-gcc).
# В CI cargo-dist ставит musl-tools сам, эта переменная там не нужна.
CC_x86_64_unknown_linux_musl = "musl-gcc"

[tasks.build]
description = "Статический бинарь как в релизе (musl, профиль dist) → target/x86_64-unknown-linux-musl/dist/aplaut"
run = "cargo build --profile dist --target x86_64-unknown-linux-musl"

[tasks.install]
description = "Собрать и поставить в ~/.local/bin, куда ставит и установщик (каталог — APLAUT_CLI_INSTALL_DIR)"
depends = ["build"]
run = '''
dir="${APLAUT_CLI_INSTALL_DIR:-$HOME/.local/bin}"
install -Dm755 target/x86_64-unknown-linux-musl/dist/aplaut "$dir/aplaut"
"$dir/aplaut" --version
'''
