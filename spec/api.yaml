openapi: 3.1.0
info:
  version: 4.1.0
  title: Aplaut Platform API
  contact:
    name: Alexander Chaychuk
    email: alex@aplaut.com
    url: https://aplaut.com
  x-logo:
    url: /assets/brand/aplaut-logo.png
    altText: Aplaut Logo
servers:
  - url: https://api.aplaut.io/v4
tags:
  - name: Введение
    description: |
      Документ содержит описание __Platform API__, которое используется для управления объектами платформы. Если вы столкнулись с какой-то проблемой,
      напишите нам <mailto:support@aplaut.com>.

      ### Кодировка

      Данные принимаются и передаются в кодировке __UTF-8__.

      ### Безопасность

      Доступ осуществляется через защищенное соединение по протоколу __HTTPS__.

      ### Дата и время

      Дата и время принимаются и передаются в формате [ISO RFC3339](https://xml2rfc.tools.ietf.org/public/rfc/html/rfc3339.html#anchor14): &nbsp;
      <span style="white-space: nowrap;">`YYYY-MM-DDTHH:MM:SS+HHMM`</span>.

      ### Формат данных

      Данные принимаются и возвращаются в формате __JSON API__. Рекомендуем ознакомиться со [спецификацией](http://jsonapi.org/).

      В запросах необходимо явно указывать заголовки: `Accept` и `Content-Type`
      со значением
      <span style="white-space: nowrap;">`application/vnd.api+json`</span>

      ### Библиотеки

      Для работы с API рекомендуем использовать [готовые библиотеки](http://jsonapi.org/implementations/).
  - name: Базовый URL
    description: |
      Базовый URL API: https://api.aplaut.io/v4.
  - name: Правила использования
    description: |
      Platform API используется для автоматизации процессов и обмена данными между нашей платформой и вашими сервисами.

      Данное API __не предназначено__ для использования на клиентских устройствах, таких как мобильные приложения или браузеры.
      Оно также не предназначено для работы через шлюзы: мобильный клиент -> шлюз (микросервис) -> Platform API.

      Причин для таких ограничений несколько:

      1. Не безопасно, т.к. ключ API можно очень легко скомпрометировать
      2. Ответы совсем не кэшируются
      3. Лимиты на кол-во запросов

      Если вам необходимо получать контент (отзывы, вопросы/ответы, …) на клиентских устройствах,
      используйте [Widgets API](/docs/api-references/widgets/) (форматы ответа HTML и JSON).

      Если контент необходимо отправлять c клиентских устройств
      (новые отзыв, вопросы, лайки), используйте [Submissions API](/docs/api-references/submissions/).

      Мы не гарантируем работоспособность API, если правила использования будут нарушены.
  - name: Фильтрация
    description: |
      В некоторых GET запросах (например: товары, отзывы) можно задать
      специальный параметры фильтрации. Для этого используются query параметр `filter`.

      Значение параметра `filter` состоит из блоков, разделенных знаком `,` (запятая).
      Каждый блок задает параметр фильтрации в следующем формате:
      <span style="white-space: nowrap;">`{параметр}:{оператор}:{значение}`</span>

      Возможные операторы:

      | Оператор |                       Описание                       |   Допустимые типы   |                    Пример                     |
      | :------- | :--------------------------------------------------- | :------------------ | :-------------------------------------------- |
      | `gt`     | больше чем (>)                                       | *Numeric, DateTime* | `filter=rating:gt:3`                          |
      | `gte`    | больше чем или равно (>=)                            | *Numeric, DateTime* | `filter=rating:gte:3`                         |
      | `lt`     | меньше чем (<)                                       | *Numeric, DateTime* | `filter=rating:lt:3`                          |
      | `lte`    | меньше чем или равно (<=)                            | *Numeric, DateTime* | `filter=rating:lte:3`                         |
      | `eq`     | равно (==)                                           | *Все типы*          | `filter=rating:eq:3`                          |
      | `neq`    | не равно (!=)                                        | *Все типы*          | `filter=rating:neq:3`                         |
      | `in`     | в списке значений; разделитель — <code>&#124;</code> | *Все типы*          | <code>filter=rating:in:3&#124;4&#124;5</code> |
      | `exists` | наличие (да/нет)                                     | *Все типы*          | `filter=pros:exists:true`                     |

      Пример фильтра c двумя параметрами:

      ```
      filter=rating:gt:3,product:eq:475
      ```
  - name: Сортировка
    description: |
      В некоторых GET запросах (например товары, отзывы) можно задать
      специальный параметры сортировки  результатов.
      Для этого используются query параметр `sort`.

      Значение параметра `sort` состоит из блоков, разделенных знаком `,` (запятая).
      Каждый блок задает параметр сортировки в следующем формате:
      <span style="white-space: nowrap;">`{параметр}:{направление сортировки}`</span>
      Направление сортировки: `asc` (&uarr;) или `desc` (&darr;).

      Пример сортировки отзывов по убыванию рейтинга и возрастанию даты создания:

      ```
      sort=rating:desc,created_at:asc
      ```
  - name: Пагинация
    description: |
      У каждого ресурса есть ограничение на максимальное кол-во объектов,
      которые можно получить за один запрос - параметр `per_page`.

      Для пагинации используется параметр - `page`,
      максимальное значение которого, определяется каждым ресурсом в отдельности.

      Чтобы обойти данные ограничения, используйте примерные алгоритмы, описанные ниже.

      #### Кейс 1: Получение только новых объектов.
      1) Сделайте запрос, в запросе укажите `sort=created_at:asc`
      2) Запомните `id` у самого последнего объекта в результате
      3) Добавьте в фильтр условие `filter=id:gt:{ID}`
      4) Сделайте запрос
      5) К шагу __2__

      #### Кейс 2: Получение обновлений объектов от начала TIME.
      1) Сделайте запрос, в запросе укажите `sort=updated_at:asc` и `updated_at:gte:{TIME}`
      2) Запомните значение атрибута `updated_at` у самого последнего объекта в результате
      3) Обновите фильтр  `filter=updated_at:gte:{TIME ON STEP 2}`
      4) Сделайте запрос
      5) К шагу __2__

      #### Кейс 3: Выгрузка всех объектов целиком.

      Используйте __обход данных__: `GET /scroll/{records_type}`, раздел
      __Обход данных__ ниже. Он снимает ограничение на номер страницы, и
      подбирать фильтр самостоятельно не нужно.

  - name: Аутентификация
    description: |
      Во всех запросах передается токен OAuth приложения через HTTP заголовок авторизации <br>
      `Authorization` в формате `Bearer {TOKEN}`.

      Токен OAuth приложения используется для идентификации вашего аккаунта в Aplaut, 
      а также для получения доступа к конкретному API (scope).

      Пример:

      ```
      Authorization: Bearer {TOKEN}
      ```

      Токен можно получить в ЛК в разделе [Разработчикам](https://app.aplaut.io/b/developers) 

      Создайте OAuth приложение, укажите необходимые scope (Platform API) и сгенерируйте токен.

      Обратите внимание максимальное время жизни токена - 2 года. По истечении этого срока нужно будет
      сгенерировать новый токен.
  - name: Лимиты
    description: |
      Допускается __2 запроса в секунду__ с одного IP. Если скорость поступления запросов
      превышает данный лимит, то их обработка задерживается так,
      чтобы запросы обрабатывались с заданной скоростью.

      Для некоторых типов запросов есть дополнительные лимиты, которые устанавливаются __на ключ API__.
      При превышении данных лимитов вы получите код ответа `429 (Too many requests)` со следующими заголовками:
      ```
      X-RateLimit-Limit: 1
      X-RateLimit-Period: 60
      X-RateLimit-Reset: 2020-01-01T12:00:00+00:00
      ```

      Комментарии к заголовкам:
      * 1 запрос в минуту
      * Следующий запрос в 2020-01-01T12:00:00+00:00

      Это означает, что вы должны приостановить делать запросы и
      дождаться указанного времени, когда запросы снова будут разрешены.
  - name: Заказы
    description: Все про заказы и транзакции
  - name: Продукты
    description: Все про продукты, категории и бренды
  - name: Отзывы
    description: Все про отзывы и комментарии
  - name: Вопросы
    description: Все про вопросы и ответы
  - name: Клиенты
    description: Все про клиентов
  - name: Задачи на экспорт
    description: Экспорт данных через файлы
  - name: Пользователи
    description: Пользователи ЛК (админы, модераторы, и т.д.)
  - name: Опросы
    description: Все про опросы
  - name: Результаты опросов
    description: Все про результаты опросов
  - name: Обход данных
    description: |
      Обход (scroll) — способ выгрузить весь набор объектов целиком, без
      ограничения на номер страницы. Вместо номера страницы клиент передаёт
      курсор — метку места, на котором он остановился.

      Обход доступен для трёх типов объектов: `reviews`, `products`, `questions`.
      Тело страницы совпадает с телом соответствующего списка: те же атрибуты,
      те же связи, тот же формат JSON API.

      #### Алгоритм

      1) Откройте обход: `GET /scroll/{records_type}` с фильтром, сортировкой и `per_page`
      2) Прочитайте объекты из `data`, а из `meta.cursor` — курсор
      3) Запросите следующую страницу: `GET /scroll/{records_type}?cursor={CURSOR}`;
         готовый адрес лежит в `links.next`
      4) Повторяйте шаги __2__ и __3__, пока `meta.has_more` не станет `false`

      На последней странице `meta.cursor` и `links.next` отсутствуют — это и есть
      признак конца обхода. Общее число объектов приходит один раз, на первой
      странице, в `meta.total_count`.

      #### Параметры

      Фильтр, сортировка, `per_page` и `include` задаются __только при открытии__
      обхода и запоминаются в курсоре. При продолжении достаточно передать один
      `cursor`; если параметры всё же переданы, они обязаны совпасть с
      зафиксированными, иначе запрос вернёт `400`. Курсор привязан к вашей
      компании и к типу объектов: чужой или изменённый курсор не работает.

      #### Фильтр по умолчанию

      Если `filter` не передан, обход ограничивается объектами, изменёнными за
      последние __30 дней__; применённое выражение приходит в
      `meta.applied_filter` на первой странице. Любой собственный `filter`
      отменяет это ограничение целиком — в том числе такой, который `updated_at`
      не упоминает. Чтобы пройти данные за весь период, задайте границу явно,
      например `filter=updated_at:gte:2020-01-01T00:00:00Z`.

      #### Записи могут повторяться

      Если пауза между страницами превысила __2 минуты__, обход продолжится от
      последней отданной записи включительно, и несколько записей придут
      повторно. __Рассчитывайте на дубли и отсеивайте их по `id`.__

      #### Лимиты

      Сверх общих лимитов на обход действуют два ограничения __на ключ API__:

      | Ограничение                            | Значение             |
      | :------------------------------------- | :------------------- |
      | Темп запросов к обходу                 | 1 запрос в 2 секунды |
      | Открытие обходов (запрос без `cursor`) | 5 в минуту           |

      Не открывайте обход заново на каждую страницу — идите по курсору. Один
      ключ API не стоит использовать для нескольких параллельных обходов одного
      типа объектов: это увеличит число дублей.

      Ответ `503` с заголовком `Retry-After` означает временную перегрузку:
      повторите запрос через указанное число секунд, курсор остаётся
      действительным.
paths:
  /reviews:
    post:
      tags:
        - Отзывы
      summary: Создание отзыва
      description: |
        Если атрибут `product_id` не указан, то отзыв создается о компании, иначе отзыв о товаре.

        Если в списке `photos` будут невалидные URL (не-200 ответ, неподходящий формат файла), то запрос вернёт 422.
        Чтобы игнорировать невалидные фотографии, передайте мета-параметр `ignore_invalid_photos` со значением `true`.
      parameters:
        - $ref: '#/components/parameters/authToken'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/Review'
      responses:
        '201':
          $ref: '#/components/responses/ReviewCreatedResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
    get:
      tags:
        - Отзывы
      summary: Список отзывов
      deprecated: true
      description: |
        Получение списка отзывов согласно заданному фильтру.

        Вместо этого эндпоинта: для регулярной выгрузки — __Задачи на экспорт__
        (см. дальше), для прохода всего набора целиком — __Обход данных__,
        `GET /scroll/reviews`.
      parameters:
        - $ref: '#/components/parameters/authToken'
        - $ref: '#/components/parameters/includeInReview'
        - $ref: '#/components/parameters/filterInReview'
        - $ref: '#/components/parameters/sortCollection'
        - required: false
          in: query
          name: page
          description: Номер страницы
          schema:
            type: integer
            maximum: 500
        - required: false
          in: query
          name: per_page
          description: Кол-во результатов на страницу
          schema:
            type: integer
            minimum: 5
            maximum: 25
      responses:
        '200':
          $ref: '#/components/responses/ReviewCollectionResponse'
  /reviews/{id}:
    get:
      tags:
        - Отзывы
      summary: Поиск отзыва по ID
      parameters:
        - $ref: '#/components/parameters/authToken'
        - $ref: '#/components/parameters/includeInReview'
        - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          $ref: '#/components/responses/ReviewResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
    put:
      tags:
        - Отзывы
      summary: Обновление отзыва по ID
      description: |
        Если отзыв с указанным ID не найден, то создается новый отзыв с `external_id` равным ID.

        Обновление объекта `custom_attributes`:

          * новые параметры добавляются
          * существующие обновляются

        Если в списке `photos` будут невалидные URL (не-200 ответ, неподходящий формат файла), то запрос вернёт 422.
        Чтобы игнорировать невалидные фотографии, передайте мета-параметр `ignore_invalid_photos` со значением `true`.
      parameters:
        - $ref: '#/components/parameters/authToken'
        - $ref: '#/components/parameters/resourceId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/Review'
      responses:
        '200':
          $ref: '#/components/responses/ReviewUpdatedResponse'
        '201':
          $ref: '#/components/responses/ReviewCreatedResponse'
    delete:
      tags:
        - Отзывы
      summary: Удаление отзыва по ID
      parameters:
        - $ref: '#/components/parameters/authToken'
        - $ref: '#/components/parameters/resourceId'
      responses:
        '204':
          description: Успешное удаление отзыва
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
  /reviews/{id}/relationships/comments:
    get:
      tags:
        - Отзывы
      summary: Все комментарии отзыва
      parameters:
        - $ref: '#/components/parameters/authToken'
        - $ref: '#/components/parameters/includeInComment'
        - $ref: '#/components/parameters/resourceId'
        - required: false
          in: query
          name: page
          description: Номер страницы
          schema:
            type: integer
        - required: false
          in: query
          name: per_page
          description: Кол-во результатов на страницу
          schema:
            type: integer
            default: 25
      responses:
        '200':
          $ref: '#/components/responses/CommentCollectionResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
    post:
      tags:
        - Отзывы
      summary: Добавление комментария к отзыву
      parameters:
        - $ref: '#/components/parameters/authToken'
        - $ref: '#/components/parameters/resourceId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/Comment'
      responses:
        '201':
          $ref: '#/components/responses/CommentCreatedResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
  /questions:
    post:
      tags:
        - Вопросы
      summary: Создание вопроса
      description: |
        Если параметр `product_id` не указан, то вопрос создается о компании, иначе вопрос о товаре.
      parameters:
        - $ref: '#/components/parameters/authToken'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/Question'
      responses:
        '201':
          $ref: '#/components/responses/QuestionCreatedResponse'
        '422':
          $ref: '#/components/responses/ValidationErrorResponse'
    get:
      tags:
        - Вопросы
      summary: Cписок вопросов
      deprecated: true
      description: |
        Получение списка вопросов согласно заданному фильтру.

        Чтобы пройти весь набор целиком, используйте __Обход данных__:
        `GET /scroll/questions`. Задачи на экспорт этот тип объектов
        не поддерживают.
      parameters:
        - $ref: '#/components/parameters/authToken'
        - $ref: '#/components/parameters/includeInQuestion'
        - $ref: '#/components/parameters/filterInQuestion'
        - $ref: '#/components/parameters/sortCollection'
        - required: false
          in: query
          name: page
          description: Номер страницы
          schema:
            type: integer
            maximum: 50
        - required: false
          in: query
          name: per_page
          description: Кол-во результатов на страницу
          schema:
            type: integer
            minimum: 5
            maximum: 25
      responses:
        '200':
          $ref: '#/components/responses/QuestionCollectionResponse'
  /questions/{id}:
    get:
      tags:
        - Вопросы
      summary: Поиск вопроса по ID
      parameters:
        - $ref: '#/components/parameters/authToken'
        - $ref: '#/components/parameters/includeInQuestion'
        - $ref: '#/components/parameters/resourceId'
      responses:
        '200':
          $ref: '#/components/responses/QuestionResponse'
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
    put:
      tags:
        - Вопросы
      summary: Обновление вопроса по ID
      description: |
        Если вопрос с указанным ID не найден, то создается новый вопрос с `external_id` равным ID.
      parameters:
        - $ref: '#/components/parameters/authToken'
        - $ref: '#/components/parameters/resourceId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/Question'
      responses:
        '200':
          $ref: '#/components/responses/QuestionUpdatedResponse'
        '201':
          $ref: '#/components/responses/QuestionCreatedResponse'
    delete:
      tags:
        - Вопросы
      summary: Удаление вопроса по ID
      parameters:
        - $ref: '#/components/parameters/authToken'
        - $ref: '#/components/parameters/resourceId'
      responses:
        '204':
          description: Успешное удаление вопроса
        '404':
          $ref: '#/components/responses/NotFoundErrorResponse'
  /questions/{id}/relationships/answers:
    get:
      tags:
        - Вопросы
      summary: Все ответы вопроса
      parameters:
        - $ref: '#/components/parameters/authToken'
        - $ref: '#/components/parameters/includeInAnswer'
        - $ref: '#/components/parameters/resourceId'
        - required: false
          in: query
          name: page
          description: Номер страницы
          schema:
            type: integer
        - required: false
          in: query
          name: per_page
          description: Кол-во результатов на страницу
          schema:
            type: integer
            default: 25
      responses:
        '200':
