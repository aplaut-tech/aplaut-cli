[package]
name = "aplaut-cli"
version = "0.5.0"
edition = "2021"
rust-version = "1.98"
description = "Command-line client for the Aplaut Platform API"
repository = "https://github.com/aplaut-tech/aplaut-cli"
homepage = "https://aplaut.com/docs/api-references/platform/"
publish = false

# `publish = false` защищает от случайной публикации в crates.io, но dist из-за него не видит бинарь.
[package.metadata.dist]
dist = true

[lib]
name = "aplaut_cli"
path = "src/lib.rs"

[[bin]]
name = "aplaut"
path = "src/main.rs"

[dependencies]
# Самообновление (спека self-update): установщик релиза через axoupdater. reqwest — тот же крейт,
# что у axoasset, ради клиента с таймаутом; tokio — однопоточный рантайм для его async API
# и для MCP-сервера (спека mcp-server M4): stdio и дочерние процессы.
axoupdater = { version = "0.10", default-features = false, features = ["github_releases"] }
clap = { version = "4.6", features = ["derive"] }
flate2 = "1.1"
reqwest = { version = "0.13", default-features = false }
# MCP-сервер `aplaut mcp` (спека mcp-server M2): официальный SDK, без макросов и HTTP-транспорта.
rmcp = { version = "3.4", default-features = false, features = ["server", "transport-io"] }
rpassword = "7.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "io-std", "io-util", "process"] }
toml = "1.1"
# Без фичи `gzip`: иначе при скачивании архива (`download.rs`) ureq сам расшифровывает тело по
# заголовку `Content-Encoding: gzip` и снимает этот заголовок из ответа до того, как код успевает
# его увидеть — распаковку архива после этого не отличить от уже распакованного тела, и валидный
# `.jsonl.gz` может быть распакован дважды и получить `bad_response`. Решаем сами, по
# `archive_content_type` сервера, а не по заголовку транспорта; `rustls` — без изменений (TLS).
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[build-dependencies]
yaml-rust2 = "0.13"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
