        attributes:
          $ref: '#/components/schemas/SurveyResponseAttributes'
    SurveyAnswerAttributes:
      type: object
      required:
        - question_id
      properties:
        value:
          type: string
          description: Ответ
        value_type:
          type: string
          description: Тип ответа
          enum:
            - string
            - number
        question_id:
          type: string
          description: Идентификатор вопроса
        question_type:
          type: string
          description: Тип вопроса
          enum:
            - text_question
            - linear_scale_question
    SurveyAnswerRelationships:
      type: object
      description: Зависимости
      properties:
        response:
          type: object
          description: Ответ на опрос
          properties:
            data:
              $ref: '#/components/schemas/ObjectRef'
    PersistedSurveyAnswer:
      type: object
      required:
        - id
        - type
        - attributes
      properties:
        id:
          type: string
          description: Идентификатор ответа на вопрос
        type:
          type: string
          description: Всегда __survey_answers__
        attributes:
          $ref: '#/components/schemas/SurveyAnswerAttributes'
        relationships:
          $ref: '#/components/schemas/SurveyAnswerRelationships'
    SurveyAnswer:
      type: object
      required:
        - type
        - attributes
      properties:
        id:
          type: string
          description: Идентификатор ответа на вопрос
        type:
          type: string
          description: Всегда __survey_answers__
          enum:
            - survey_answers
        attributes:
          $ref: '#/components/schemas/SurveyAnswerAttributes'
    ExportTaskAttributes:
      type: object
      properties:
        records_type:
          type: string
          description: Тип записей, которые необходимо экспортировать
          enum:
            - reviews
            - products
            - survey_responses
        search_options:
          type: object
          description: Фильтр для экспорта. Если не указывается, выгружаются все записи.
        format:
          type: string
          description: Формат файла.
          enum:
            - csv
            - xlsx
            - jsonl
        export_format:
          type: string
          description: |
            Кастомный [JQ фильтр](https://stedolan.github.io/jq/manual/)
            для трансформации экспортируемых объектов.
            Работает только для форматов `csv` и `xlsx`.
    ExportTask:
      type: object
      required:
        - type
        - attributes
      properties:
        type:
          type: string
          description: Всегда __export_tasks__
          enum:
            - export_tasks
        attributes:
          $ref: '#/components/schemas/ExportTaskAttributes'
    ExportTaskPersisted:
      type: object
      required:
        - id
        - type
      properties:
        id:
          type: string
          description: Идентификатор задачи
        type:
          type: string
          description: Всегда __export_tasks__
          enum:
            - export_tasks
        attributes:
          allOf:
            - $ref: '#/components/schemas/ExportTaskAttributes'
            - type: object
              properties:
                state:
                  type: string
                  description: Статус задачи
                  enum:
                    - waiting
                    - processing
                    - completed
                    - suspended
                archive_content_type:
                  type: string
                  description: MIME тип архива
                archive_size:
                  type: number
                  description: Размер архива в байтах
                archive_url:
                  type: string
                  description: URL архива с файлом в выбранном формате
                created_at:
                  type: string
                  format: date-time
                  description: Время создания задачи
                started_at:
                  type: string
                  format: date-time
                  description: Время начала экспорта
                suspended_at:
                  type: string
                  format: date-time
                  description: Время отмены экспорта
                completed_at:
                  type: string
                  format: date-time
                  description: Время завершения успешного экспорта
                rejected_at:
                  type: string
                  format: date-time
                  description: Время завершения экспорта с ошибкой
                rejection_message:
                  type: string
                  description: Причина ошибки экспорта
    UserAttributes:
      type: object
      properties:
        email:
          type: string
          description: Email
        name:
          type: string
          description: ФИО
        first_name:
          type: string
          description: Имя
        occupation:
          type: string
          description: Дескриптор (обычно должность)
        avatar_url:
          type: string
          description: URL аватара
        role:
          type: string
          description: Роль
          enum:
            - company_manager
            - company_moderator
            - company_admin
            - admin
    User:
      type: object
      required:
        - type
        - attributes
      properties:
        type:
          type: string
          description: Всегда __users__
          enum:
            - users
        attributes:
          $ref: '#/components/schemas/UserAttributes'
    ScrollMeta:
      type: object
      required:
        - has_more
        - count
      properties:
        has_more:
          description: Остались ли ещё страницы. `false` — обход закончен
          type: boolean
        count:
          description: Кол-во объектов на этой странице
          type: integer
        cursor:
          description: Курсор следующей страницы. Отсутствует на последней странице
          type: string
        total_count:
          description: Всего объектов в выдаче. Отдаётся только на первой странице
          type: integer
        applied_filter:
          description: |
            Фильтр, подставленный сервером вместо непереданного `filter`.
            Приходит только на первой странице и только когда дефолт применён
          type: string
    Error:
      type: object
      properties:
        status:
          type: string
        title:
          type: string
        details:
          type: array
          items:
            type: string
