  /products:
    post:
      tags:
        - Продукты
      summary: Создание продукта
      description: |
        Категория продукта будет, в порядке приоритета:

        1. Найдена или создана по цепочке имён `category_names`, начиная с корневой категории.
        2. Найдена по ID `category_id`.
        3. Найдена по имени `category_name`.
        4. Создана из `category_id` и `category_name`.
        5. Создана из `category_name`; ID будет сгенерирован.

        Если не указывать `category_names`, `category_id` или `category_name`, то товар привяжется к корневой категории.
