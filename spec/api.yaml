        '429':
          $ref: '#/components/responses/TooManyRequestsErrorResponse'
        '503':
          $ref: '#/components/responses/ScrollUnavailableResponse'
components:
  parameters:
    authToken:
      name: Authorization
      in: header
      description: |
        Токен аутентификации в формате `Bearer {TOKEN}` 
        (см. раздел Аутентификация выше)
      required: true
      schema:
        type: string
    sortCollection:
      required: false
      in: query
      name: sort
      description: |
        Сортировка результатов.
      schema:
        type: string
    resourceId:
      required: true
      in: path
      name: id
      description: Внутренний или внешний идентификатор объекта
      schema:
        type: string
    filterInReview:
      required: false
      in: query
      name: filter
      description: |
        Фильтр результатов. Параметры для фильтрации:

        |    Параметр    |               Операторы               |            Возможные значения            |
        | :------------- | :------------------------------------ | :--------------------------------------- |
        | `context_type` | `eq`, `neq`                           | `store`, `product`, `category`,`brand`,  |
        | `rating`       | `eq`, `gt`, `gte`, `lt`, `lte`, `neq` | `1…5`                                    |
        | `product_id`   | `eq`                                  | __string__                               |
        | `created_at`   | `eq`, `gt`, `gte`, `lt`, `lte`, `neq` | __date-time__                            |
        | `updated_at`   | `eq`, `gt`, `gte`, `lt`, `lte`, `neq` | __date-time__                            |
        | `state`        | `eq`, `neq`                           | `published`, `waiting`, `banned`, `held` |

        Пример: `filter=rating:eq:2,state:eq:published`
      schema:
        type: string
    includeInReview:
      required: false
      in: query
      name: include
      description: |
        Массив объектов, которые должны включаться в ответ.
        Значения разделяются запятыми. Пример: `include=product,author`
      schema:
        type: string
        enum:
          - author
          - product
          - comments
          - state_changes
    filterInConsumer:
      required: false
      in: query
      name: filter
      description: |
        Фильтр результатов. Параметры для фильтрации:

        |    Параметр    |               Операторы               | Возможные значения |
        | :------------- | :------------------------------------ | :----------------- |
        | `created_at`   | `eq`, `gt`, `gte`, `lt`, `lte`, `neq` | __date-time__      |
        | `updated_at`   | `eq`, `gt`, `gte`, `lt`, `lte`, `neq` | __date-time__      |
        | `unsubscribed` | `eq`, `neq`                           | __boolean__        |

        Пример: `filter=unsubscribed:eq:true`
      schema:
        type: string
    includeInConsumer:
      required: false
      in: query
      name: include
      description: |
        Массив объектов, которые должны включаться в ответ.
        Значения разделяются запятыми. Пример: `include=reviews,questions`
      schema:
        type: string
        enum:
          - reviews
          - questions
          - orders
    includeInComment:
      required: false
      in: query
      name: include
      description: |
        Массив объектов, которые должны включаться в ответ.
        Значения разделяются запятыми. Пример: `include=author`
      schema:
        type: string
        enum:
          - author
    filterInQuestion:
      required: false
      in: query
      name: filter
      description: |
        Фильтр результатов. Параметры для фильтрации:

        |    Параметр    |               Операторы               |            Возможные значения            |
        | :------------- | :------------------------------------ | :--------------------------------------- |
        | `context_type` | `eq`, `neq`                           | `store`, `product`, `category`,`brand`,  |
        | `product_id`   | `eq`,                                 | __string__                               |
        | `created_at`   | `eq`, `gt`, `gte`, `lt`, `lte`, `neq` | __date-time__                            |
        | `updated_at`   | `eq`, `gt`, `gte`, `lt`, `lte`, `neq` | __date-time__                            |
        | `state`        | `eq`, `neq`                           | `published`, `waiting`, `banned`, `held` |

        Пример: `filter=product_id:eq:256788,state:eq:published`
      schema:
        type: string
    includeInQuestion:
      required: false
      in: query
      name: include
      description: |
        Массив объектов, которые должны включаться в ответ.
        Значения разделяются запятыми. Пример: `include=answers`
      schema:
        type: string
        enum:
          - author
          - product
          - answers
    includeInAnswer:
      required: false
      in: query
      name: include
      description: |
        Массив объектов, которые должны включаться в ответ.
        Значения разделяются запятыми. Пример: `include=author`
      schema:
        type: string
        enum:
          - author
    filterInOrder:
      required: false
      in: query
      name: filter
      description: |
        Фильтр результатов. Параметры для фильтрации:

        | Параметр     | Операторы                             | Возможные значения                       |
        | :---------   | :----------------------------------   | :---------------------------             |
        | `created_at` | `eq`, `gt`, `gte`, `lt`, `lte`, `neq` | __date-time__                            |
        | `updated_at` | `eq`, `gt`, `gte`, `lt`, `lte`, `neq` | __date-time__                            |

        Пример: `filter=created_at:gte:2016-04-12T23:20:50.52Z`
      schema:
        type: string
    includeInOrder:
      required: false
      in: query
      name: include
      description: |
        Массив объектов, которые должны включаться в ответ.
        Значения разделяются запятыми. Пример: `include=product`
      schema:
        type: string
        enum:
          - product
          - consumer
    filterInProduct:
      required: false
      in: query
      name: filter
      description: |
        Фильтр результатов. Параметры для фильтрации:

        |    Параметр    |               Операторы               |            Возможные значения            |
        | :------------- | :------------------------------------ | :--------------------------------------- |
        | `external_id`  | `eq`, `neq`, `in`                     | __string__                               |
        | `vendor_code`  | `eq`, `neq`, `in`                     | __string__                               |
        | `group_id`     | `eq`, `neq`, `in`                     | __string__                               |

        Пример: `filter=external_id:in:a225|a226|a227`.
      schema:
        type: string
    includeInProduct:
      required: false
      in: query
      name: include
      description: |
        Массив объектов, которые должны включаться в ответ.
        Значения разделяются запятыми. Пример: `include=reviews_summary_item`

        Сводка отзывов приходит только так: собственного атрибута у товара нет.
      schema:
        type: string
        enum:
          - reviews_summary_item
          - reviews
          - questions
          - brand
          - category
    filterInSurvey:
      required: false
      in: query
      name: filter
      description: |
        Фильтр результатов. Параметры для фильтрации:

        | Параметр       | Операторы                             | Возможные значения |
        | :------------- | :------------------------------------ | :----------------- |
        | `name`         | `eq`, `neq`                           | __string__         |
        | `created_at`   | `eq`, `gt`, `gte`, `lt`, `lte`, `neq` | __date-time__      |
        | `updated_at`   | `eq`, `gt`, `gte`, `lt`, `lte`, `neq` | __date-time__      |

        Пример: `filter=name:eq:NPS`
      schema:
        type: string
    includeInSurvey:
      required: false
      in: query
      name: include
      description: |
        Массив объектов, которые должны включаться в ответ.
        Значения разделяются запятыми. Пример: `include=questions`
      schema:
        type: string
        enum:
          - questions
    filterInSurveyResponse:
      required: false
      in: query
      name: filter
      description: |
        Фильтр результатов. Параметры для фильтрации:

        | Параметр       | Операторы                             | Возможные значения |
        | :------------- | :------------------------------------ | :----------------- |
        | `survey_id`    | `eq`, `neq`                           | __string__         |
        | `created_at`   | `eq`, `gt`, `gte`, `lt`, `lte`, `neq` | __date-time__      |
        | `updated_at`   | `eq`, `gt`, `gte`, `lt`, `lte`, `neq` | __date-time__      |

        Пример: `filter=survey_id:eq:592ee4696dbfd69acd73c0be`
      schema:
        type: string
    includeInSurveyResponse:
      required: false
      in: query
      name: include
      description: |
        Массив объектов, которые должны включаться в ответ.
        Значения разделяются запятыми. Пример: `include=answers,author`
      schema:
        type: string
        enum:
          - answers
          - author
    scrollRecordsType:
      required: true
      in: path
      name: records_type
      description: Тип объектов, по которым идёт обход
      schema:
        type: string
        enum:
          - reviews
          - products
          - questions
    scrollCursor:
      required: false
      in: query
      name: cursor
      description: |
        Курсор с предыдущей страницы (`meta.cursor`). Без него открывается новый
        обход, с ним — продолжается начатый; остальные параметры при продолжении
        передавать не нужно.
      schema:
        type: string
    scrollFilter:
      required: false
      in: query
      name: filter
      description: |
        Фильтр результатов, синтаксис общий (см. раздел __Фильтрация__).
        Задаётся только при открытии обхода. Набор параметров зависит от типа
        объектов:

        |     Тип     |                                                                                                   Параметры                                                                                                   |
        | :---------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
        | `reviews`   | `created_at`, `updated_at`, `published_at`, `state`, `context_type`, `product_id`, `product_group_id`, `brand_id`, `category_id`, `rating`, `origin`, `syndication_source`, `order_number`, `lang`, `verified`, `featured`, `recommended` |
        | `products`  | `created_at`, `updated_at`, `last_imported_at`, `summary_updated_at`, `external_id`, `group_id`, `brand_id`, `category_id`, `vendor_code`, `available`, `price`, `rating`                                      |
        | `questions` | `created_at`, `updated_at`, `published_at`, `imported_at`, `state`, `context_type`, `product_id`, `product_external_id`, `product_group_id`, `brand_id`, `category_id`, `lang`, `origin`, `has_published_answers` |

        В операторе `in` допустимо не больше 25 значений.
        Неизвестный параметр — ответ `422`, неразбираемое выражение — `400`.

        Если параметр не передан, применяется фильтр по умолчанию: `updated_at`
        за последние 30 дней, см. раздел __Обход данных__.
      schema:
        type: string
    scrollSort:
      required: false
      in: query
      name: sort
      description: |
        Сортировка результатов, одно поле на запрос и только по возрастанию:
        `updated_at:asc` или `created_at:asc`. По умолчанию — `updated_at:asc`.
        Задаётся только при открытии обхода.
      schema:
        type: string
        default: updated_at:asc
        enum:
          - updated_at:asc
          - created_at:asc
    scrollInclude:
      required: false
      in: query
      name: include
      description: |
        Связанные объекты, которые попадут в `included`. Значения разделяются
        запятыми, задаются только при открытии обхода. Набор зависит от типа
        объектов:

        |     Тип     |                Значения                 |
        | :---------- | :-------------------------------------- |
        | `reviews`   | `author`, `product`, `comments`, `state_changes` |
        | `products`  | `reviews_summary_item`                  |
        | `questions` | `author`, `product`, `answers`          |

        Пример: `include=author,product`
      schema:
        type: string
    scrollPerPage:
      required: false
      in: query
      name: per_page
      description: |
        Кол-во объектов на страницу. Задаётся только при открытии обхода.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
